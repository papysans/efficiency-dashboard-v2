ai_estimation:
  enabled: true
  # api_key: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  # base_url: "https://open.bigmodel.cn/api/anthropic"
  # model: "claude-3-5-sonnet-20241022"
  api_key: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  base_url: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeout_ms: 300000
  http_proxy: ""

algo_estimation:
  # === v2 常用调参 ===
  # 古法每写 1 行代码需要多少分钟。数值越大，古法基线越高，工作量提效越容易为正。
  # 例如 1.8 表示古法约 33 行/小时；如果同时配置 commit_line_per_minutes，优先使用本字段。
  commit_minutes_per_line: 1.8  # 每行代码古法时间，2.0→1.8 轻微压低基线
  max_input_chars: 300000    # 最大输入字符数
  max_ratio: 50              # 工作量的最大倍数
  max_factor: 1.0            # 最大的加权系数
  min_factor: 0.2            # 最小的加权系数
  inchars_per_minutes: 20    # 人每分钟输入20个字
  lines_per_minutes: 2       # 人每分钟输入2行代码
  min_minutes: 5             # 最小分钟数
  # 兼容旧字段：古法每分钟写多少行。新调参优先改 commit_minutes_per_line。
  # commit_line_per_minutes: 0.5


efficiency_v2:
  # === v2 常用调参 ===
  baseline_defaults:
    # 三种古法基线的融合权重。LLM 关闭时，会在可用基线之间自动重归一。
    # 想让工作量提效更容易为正：提高 weight_algo，降低 weight_knn。
    weight_algo: 0.60
    weight_knn: 0.15
    weight_llm: 0.25
    # 工作量换算为日历周期的密度，只影响日历提效，不影响工作量提效。
    team_work_density: 0.35
  # 并行 session 人时去重：need 内同一用户多个时间窗重叠的 session（同时开多个 IDE 会话），
  # active 人时按该用户 session 区间并集时长封顶。默认 true；写 false 恢复直接求和。
  # parallel_session_union: true
  stage:
    # 原始工具调用没有结束时间时，用这些默认耗时补齐。
    default_edit_duration_seconds: 30
    default_read_duration_seconds: 10
    default_command_duration_seconds: 30
    default_other_duration_seconds: 10
    # 消息事件按字符数估时：300 表示每分钟 300 字。
    default_message_chars_per_minute: 300
    gap_threshold_minutes: 5
    extension_minutes: 2
    max_inferred_duration_gap_minutes: 5

task_statistics:
  gap_threshold_minutes: 10
  extension_minutes: 5

traditional_dev_lines_per_day: 100
silica_max_days: 7

task_dir: "s3://user-indicator/raw-dump/task"
repo_dir: "s3://user-indicator/raw-dump/repo"
analysed_dir: "./analysed"

# 存储后端：目录路径以 s3:// 开头时走 S3 兼容对象存储（MinIO 等），否则本地磁盘，可混搭。
# 上游 user-indicator 已切 S3 分片布局(rawDumpConfig.blobStorageType=s3)，看板读 raw 改指 MinIO：
#   task_dir: "s3://user-indicator/raw-dump/task"     # bucket=user-indicator, prefix=raw-dump
#   repo_dir:  "s3://user-indicator/raw-dump/repo"
# conversation 在 task/conversation/YYYY/MM/DD/<sessionId>/00000N.jsonl 目录分片，import 自动按目录重组。
storage:
  s3:
    endpoint: "192.168.137.1:9000"   # 不含 scheme；内网直连或经 ssh -L 转发
    access_key: "minioadmin"
    secret_key: "minioadmin"
    use_ssl: true                    # 上游 MinIO 为 https
    skip_verify: true                # 自签证书 + endpoint 走 IP/转发口，证书域名对不上需跳过校验

# 上游 user-indicator 使用 S3 时会把 raw 文件索引写入 PostgreSQL。
# 线上 S3 不支持 ListObjects，因此导入端通过索引表枚举对象，再用 storage.s3 GetObject 读取。
raw_index:
  enabled: true
  dsn: "host=192.168.137.1 port=45432 user=costrict password=costrict dbname=user_indicator sslmode=disable"
  s3_base: "s3://user-indicator/raw-dump"

org_csv_file: "./analysed/org_mapping.csv"
org_dsn: "host=192.168.137.1 port=45432 user=costrict password=costrict dbname=user_indicator sslmode=disable"
# dept-sync 部门同步服务（import-dept 用）：拉部门树+人员落库 dept/dept_user 并投影回填 user_org
# base_url 填 dept-sync 服务地址（不含路由前缀）；query_key 由 dept-sync 管理员发放（X-Query-Key）
# fallback_org_name：universal_id/工号都未命中 dept-sync 的看板用户兜底 org1（空=不兜底，保持原样）。
# fallback_dept_name：兜底 org2（默认 "未知部门"），仅在 fallback_org_name 非空时生效。
dept_sync:
  base_url: ""
  query_key: ""
  fallback_org_name: ""
  fallback_dept_name: "未知部门"
# HTTP 代理（用于 git clone 等网络操作）
http_proxy: "http://127.0.0.1:7890"

# 分析起始日下界：所有取数/计算不处理此日期之前的数据（未显式传 --start-date 时自动套用）。
# 开发模板默认 ""（不设下界，处理全部历史）；内网部署在 compose/kbcli/config.yaml 里设为 20260525。
analysis_start_date: ""

serve:
  port: 8080
  init:
    command: import
    params:
      force: false        # 启动只做增量补齐，不再 force 全量重算
  crontab:
    # 每 4 小时增量 import（含 import-org 非破坏占位 + import-dept dept-sync 刷新真名/部门 + efficiency 重算）。
    # 增量靠跳过已导入；下界由全局 analysis_start_date 控制，不碰起始日之前。
    - schedule: "0 0 */4 * * *"
      command: import
      params:
        force: false
    # 每日 04:30 LLM 估算新增 task（只补未估算的）
    - schedule: "0 30 4 * * *"
      command: fix-task
    # 每日 05:00 LLM 估算新增 commit
    - schedule: "0 0 5 * * *"
      command: fix-commit
    # 每周日 03:00 全量校正一次（force 重算 [起始日,今]，纠偏）
    - schedule: "0 0 3 * * 0"
      command: import
      params:
        force: true
