apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-config
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ .Values.server.port }}

    stat_database:
      host: {{ .Values.statDatabase.host | quote }}
      port: {{ .Values.statDatabase.port }}
      user: {{ .Values.statDatabase.user | quote }}
      password: {{ .Values.statDatabase.password | quote }}
      dbname: {{ .Values.statDatabase.dbname | quote }}
      sslmode: {{ .Values.statDatabase.sslmode | quote }}

    task_dir: {{ .Values.paths.taskDir | quote }}
    repo_dir: {{ .Values.paths.repoDir | quote }}
    analysed_dir: {{ .Values.paths.analysedDir | quote }}

    cors:
      allow_origins:
        {{- range .Values.cors.allowOrigins }}
        - {{ . | quote }}
        {{- end }}

    dashboard_title_prefix: {{ .Values.dashboardTitlePrefix | quote }}

    ai_estimation:
      enabled: {{ .Values.aiEstimation.enabled }}
      api_key: {{ .Values.aiEstimation.apiKey | quote }}
      base_url: {{ .Values.aiEstimation.baseUrl | quote }}
      model: {{ .Values.aiEstimation.model | quote }}
      timeout_ms: {{ .Values.aiEstimation.timeoutMs }}
      http_proxy: {{ .Values.aiEstimation.httpProxy | quote }}

    task_real_minutes:
      gap_threshold_minutes: {{ .Values.taskRealMinutes.gapThresholdMinutes }}
      extension_minutes: {{ .Values.taskRealMinutes.extensionMinutes }}
