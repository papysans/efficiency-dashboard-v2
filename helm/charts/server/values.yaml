global:
  imageRegistry: ""
  imagePullSecrets: []
  timezone: Asia/Shanghai

image:
  repository: zgsm/efficiency-dashboard-backend
  tag: "v1.0.9"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 9990

resources:
  limits:
    memory: 1Gi
    cpu: 1000m
  requests:
    memory: 512Mi
    cpu: 500m

database:
  host: "postgresql"
  port: 5432
  user: "postgres"
  password: "1"
  dbname: "report"
  sslmode: "disable"

statDatabase:
  host: "postgresql"
  port: 5432
  user: "postgres"
  password: "1"
  dbname: "costrict_stat"
  sslmode: "disable"

server:
  port: 9990

paths:
  taskDir: "/app/task/raw/task"
  repoDir: "/app/task/raw/repo"
  analysedDir: "/app/analysed"

aiEstimation:
  enabled: false
  apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  baseUrl: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeoutMs: 300000
  httpProxy: ""

taskRealMinutes:
  gapThresholdMinutes: 30
  extensionMinutes: 5

cors:
  allowOrigins:
    - "*"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: efficiency-dashboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: efficiency-dashboard-tls
      hosts:
        - efficiency-dashboard.example.com

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}
