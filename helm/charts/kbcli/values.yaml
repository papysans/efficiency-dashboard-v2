global:
  imageRegistry: ""
  imagePullSecrets: []
  timezone: Asia/Shanghai

image:
  repository: zgsm/efficiency-dashboard-kbcli
  tag: "v1.0.9"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m

statDatabase:
  host: "postgresql"
  port: 5432
  user: "postgres"
  password: "1"
  dbname: "costrict_stat"
  sslmode: "disable"

backend:
  host: "server"
  port: 9990

paths:
  taskDir: "/app/task/raw/task"
  repoDir: "/app/task/raw/repo"
  analysedDir: "/app/analysed"
  orgCsvFile: "/app/analysed/org_mapping.csv"

modelPrices:
  GLM-4.7:
    inPrice: 0.5
    outPrice: 1.0
  GLM-5:
    inPrice: 1.0
    outPrice: 2.0
  Kimi-K2.5-Moonshot:
    inPrice: 1.0
    outPrice: 2.0
  MiniMax-M2.1:
    inPrice: 0.5
    outPrice: 1.0
  Auto:
    inPrice: 0.0
    outPrice: 0.0

volumes:
  taskDir:
    enabled: true
    externalPvc:
      enabled: true
      name: user-indicator-storage
      namespace: costrict
  analysedDir:
    enabled: true
    pvc:
      enabled: true
      size: 100Gi
      storageClass: "costrict-loki"
      accessMode: ReadWriteOnce

aiEstimation:
  enabled: true
  apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  baseUrl: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeoutMs: 300000
  prompt: ""

algoEstimation:
  maxInputChars: 300000
  maxRatio: 50
  maxFactor: 1.0
  minFactor: 0.2
  incharsPerMinutes: 20
  linesPerMinutes: 2
  minMinutes: 5

httpProxy: "http://127.0.0.1:7890"

orgDSN: "host=10.72.10.64 port=25432 user=costrict_reader password=hello_costrict sslmode=disable"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0

securityContext:
  allowPrivilegeEscalation: true

nodeSelector: {}

tolerations: []

affinity: {}
