# Default values for efficiency-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  timezone: Asia/Shanghai

# PostgreSQL configuration
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: 14
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 500Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 500Mi

  postgresConfig:
    maxConnections: 200
    sharedBuffers: 256MB
    effectiveCacheSize: 1GB
    maintenanceWorkMem: 64MB
    checkpointCompletionTarget: 0.9
    defaultStatisticsTarget: 100
    randomPageCost: 1.1
    effectiveIoConcurrency: 200
    workMem: 4MB
    checkpointTimeout: 10min

  auth:
    user: postgres
    password: "1"
    database: report
    statDatabase: costrict_stat

  healthcheck:
    enabled: true
    test: ["CMD-SHELL", "pg_isready -U postgres -d report"]
    interval: 10s
    timeout: 5s
    retries: 5
    startPeriod: 30s

# Server configuration
server:
  enabled: true
  image:
    repository: efficiency-dashboard-backend
    tag: "1.0.8"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 9990

  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 500m

  # External volumes configuration
  volumes:
    taskDir:
      enabled: true
      # For production, mount from external storage
      hostPath: "/mnt/prod_env/user-indicator/raw/task"
      # For PVC, set pvcEnabled: true and specify pvcName
      pvcEnabled: false
      pvcName: ""
    analysedDir:
      enabled: true
      pvcEnabled: false
      pvcName: ""

  externalDatabase:
    host: "postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "report"
    statDbname: "costrict_stat"
    sslmode: "disable"

  aiEstimation:
    enabled: true
    apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
    baseUrl: "https://open.bigmodel.cn/api/anthropic"
    model: "claude-3-5-sonnet-20241022"
    timeoutMs: 300000
    httpProxy: ""

  taskRealMinutes:
    gapThresholdMinutes: 30
    extensionMinutes: 5

  cors:
    allowOrigins:
      - "*"

# Portal (Nginx) configuration
portal:
  enabled: false
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 128Mi
      cpu: 250m

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: efficiency-dashboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: efficiency-dashboard-tls
      hosts:
        - efficiency-dashboard.example.com

# Service Account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 1000
  fsGroup: 1000

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Storage class for all PVCs
storageClass: ""

# Database initialization scripts
initDbScripts:
  createDb: |
    CREATE DATABASE report;
    CREATE DATABASE costrict_stat;

# kbcli configuration
kbcli:
  enabled: true
  image:
    repository: efficiency-dashboard-kbcli
    tag: "v1.0.1"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m

  # External volumes configuration
  volumes:
    taskDir:
      enabled: true
      # For production, mount from external storage
      hostPath: "/mnt/prod_env/user-indicator/raw/task"
      # For PVC, set pvcEnabled: true and specify pvcName
      pvcEnabled: false
      pvcName: ""
    repoDir:
      enabled: true
      hostPath: "/mnt/prod_env/user-indicator/raw/repo"
      pvcEnabled: false
      pvcName: ""
    analysedDir:
      enabled: true
      pvcEnabled: false
      pvcName: ""

  # AI estimation configuration
  aiEstimation:
    enabled: true
    apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
    baseUrl: "https://open.bigmodel.cn/api/anthropic"
    model: "claude-3-5-sonnet-20241022"
    timeoutMs: 300000
    prompt: ""

  # HTTP proxy for git operations
  httpProxy: "http://127.0.0.1:7890"

  # External indicator database
  indicatorDSN: "host=10.72.10.64 port=25432 user=costrict_reader password=hello_costrict sslmode=disable"

  # External services configuration (used when internal services are disabled)
  externalDatabase:
    host: "postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "report"
    statDbname: "costrict_stat"
    sslmode: "disable"

  externalBackend:
    host: "server"
    port: 9990
