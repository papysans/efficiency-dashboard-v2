global:
  imageRegistry: ""
  imagePullSecrets: []
  timezone: Asia/Shanghai

postgresql:
  enabled: true
  auth:
    user: postgres
    password: "1"
    database: report
    statDatabase: costrict_stat

server:
  enabled: true
  image:
    repository: zgsm/efficiency-dashboard-backend
    tag: "v1.0.9"
  database:
    host: "efficiency-dashboard-postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "report"
    sslmode: "disable"
  statDatabase:
    host: "efficiency-dashboard-postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "costrict_stat"
    sslmode: "disable"
  waitForPostgres:
    enabled: false
  aiEstimation:
    enabled: false
    apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
    baseUrl: "https://open.bigmodel.cn/api/anthropic"
    model: "claude-3-5-sonnet-20241022"
    timeoutMs: 300000
    httpProxy: ""
  taskRealMinutes:
    gapThresholdMinutes: 30
    extensionMinutes: 5
  cors:
    allowOrigins:
      - "*"

portal:
  enabled: false
  backend:
    host: "efficiency-dashboard-server"
    port: 9990

kbcli:
  enabled: true
  image:
    repository: zgsm/efficiency-dashboard-kbcli
    tag: "v1.0.9"
  database:
    host: "efficiency-dashboard-postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "report"
    sslmode: "disable"
  statDatabase:
    host: "efficiency-dashboard-postgresql"
    port: 5432
    user: "postgres"
    password: "1"
    dbname: "costrict_stat"
    sslmode: "disable"
  waitForPostgres:
    enabled: true
  backend:
    host: "efficiency-dashboard-server"
    port: 9990
  volumes:
    taskDir:
      enabled: true
      externalPvc:
        enabled: true
        name: user-indicator-storage
        namespace: costrict
    analysedDir:
      enabled: true
      pvc:
        enabled: true
        size: 100Gi
        storageClass: ""
        accessMode: ReadWriteOnce
  aiEstimation:
    enabled: true
    apiKey: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
    baseUrl: "https://open.bigmodel.cn/api/anthropic"
    model: "claude-3-5-sonnet-20241022"
    timeoutMs: 300000
    prompt: ""
  httpProxy: "http://127.0.0.1:7890"
  indicatorDSN: "host=10.72.10.64 port=25432 user=costrict_reader password=hello_costrict sslmode=disable"
