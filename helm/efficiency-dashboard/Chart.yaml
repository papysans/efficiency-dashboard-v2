apiVersion: v2
name: efficiency-dashboard
description: A Helm chart for efficiency dashboard application
type: application
version: 0.3.0
appVersion: "1.0.8"

keywords:
  - efficiency
  - dashboard

maintainers:
  - name: efficiency-team

dependencies:
  - name: postgresql
    version: 0.2.0
    repository: file://../charts/postgresql
    condition: postgresql.enabled

  - name: server
    version: 0.2.0
    repository: file://../charts/server
    condition: server.enabled

  - name: portal
    version: 0.2.0
    repository: file://../charts/portal
    condition: portal.enabled

  - name: kbcli
    version: 0.2.0
    repository: file://../charts/kbcli
    condition: kbcli.enabled
