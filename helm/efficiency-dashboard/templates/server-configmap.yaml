{{- if .Values.server.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efficiency-dashboard.fullname" . }}-server-config
  labels:
    {{- include "efficiency-dashboard.server.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: 9990

    database:
      {{- if .Values.postgresql.enabled }}
      host: "{{ include "efficiency-dashboard.fullname" . }}-postgresql"
      port: 5432
      user: {{ .Values.postgresql.auth.user | quote }}
      password: {{ .Values.postgresql.auth.password | quote }}
      dbname: {{ .Values.postgresql.auth.database | quote }}
      sslmode: "disable"
      {{- else }}
      host: {{ .Values.server.externalDatabase.host | quote }}
      port: {{ .Values.server.externalDatabase.port }}
      user: {{ .Values.server.externalDatabase.user | quote }}
      password: {{ .Values.server.externalDatabase.password | quote }}
      dbname: {{ .Values.server.externalDatabase.dbname | quote }}
      sslmode: {{ .Values.server.externalDatabase.sslmode | quote }}
      {{- end }}

    stat_database:
      {{- if .Values.postgresql.enabled }}
      host: "{{ include "efficiency-dashboard.fullname" . }}-postgresql"
      port: 5432
      user: {{ .Values.postgresql.auth.user | quote }}
      password: {{ .Values.postgresql.auth.password | quote }}
      dbname: {{ .Values.postgresql.auth.statDatabase | quote }}
      sslmode: "disable"
      {{- else }}
      host: {{ .Values.server.externalDatabase.host | quote }}
      port: {{ .Values.server.externalDatabase.port }}
      user: {{ .Values.server.externalDatabase.user | quote }}
      password: {{ .Values.server.externalDatabase.password | quote }}
      dbname: {{ .Values.server.externalDatabase.statDbname | quote }}
      sslmode: {{ .Values.server.externalDatabase.sslmode | quote }}
      {{- end }}

    rawdata_dir: "/app/rawdata"
    task_dir: "/app/task"
    analysed_dir: "/app/analysed"

    cors:
      allow_origins:
        {{- range .Values.server.cors.allowOrigins }}
        - {{ . | quote }}
        {{- end }}

    ai_estimation:
      enabled: {{ .Values.server.aiEstimation.enabled }}
      api_key: {{ .Values.server.aiEstimation.apiKey | quote }}
      base_url: {{ .Values.server.aiEstimation.baseUrl | quote }}
      model: {{ .Values.server.aiEstimation.model | quote }}
      timeout_ms: {{ .Values.server.aiEstimation.timeoutMs }}
      http_proxy: {{ .Values.server.aiEstimation.httpProxy | quote }}

    task_real_minutes:
      gap_threshold_minutes: {{ .Values.server.taskRealMinutes.gapThresholdMinutes }}
      extension_minutes: {{ .Values.server.taskRealMinutes.extensionMinutes }}
{{- end }}
