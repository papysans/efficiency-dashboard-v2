{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efficiency-dashboard.fullname" . }}-elasticsearch
  labels:
    {{- include "efficiency-dashboard.elasticsearch.labels" . | nindent 4 }}
spec:
  type: {{ .Values.elasticsearch.service.type }}
  ports:
    - port: {{ .Values.elasticsearch.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "efficiency-dashboard.elasticsearch.selectorLabels" . | nindent 4 }}
{{- end }}
