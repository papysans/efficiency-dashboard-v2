{{- if .Values.kbcli.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efficiency-dashboard.fullname" . }}-kbcli
  labels:
    {{- include "efficiency-dashboard.kbcli.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kbcli.service.type }}
  ports:
    - port: {{ .Values.kbcli.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "efficiency-dashboard.kbcli.selectorLabels" . | nindent 4 }}
{{- end }}
