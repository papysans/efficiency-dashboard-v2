name: build-and-push-images

# 触发：打 v* tag 自动构建推 ghcr；也可在 Actions 页手动跑（指定版本）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.1.1，最终镜像 tag 为 beta-v1.1.1）"
        required: true
        default: "v1.1.1"

env:
  REGISTRY: ghcr.io

# 只用 actions/checkout；docker login/build/push 全走 runner 自带 docker CLI，
# 不依赖 docker/* marketplace action（该 runner 下载 docker/* action 持续失败）。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN 推 ghcr 所需，无需额外 PAT
    strategy:
      fail-fast: false        # 一个镜像偶发失败（如 checkout 瞬时 403）不连累其它
      matrix:
        include:
          - name: server
            dockerfile: backend/Dockerfile
          - name: kbcli
            dockerfile: kbcli/Dockerfile
          - name: portal
            dockerfile: compose/portal/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: 构建并推送 ${{ matrix.name }}（linux/amd64,arm64）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          NAME: ${{ matrix.name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$GITHUB_REF_NAME"; fi
          VERSION="beta-${RAW}"                       # beta 前缀
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"   # ghcr 要求小写
          IMG="${REGISTRY}/${OWNER_LC}/efficiency-dashboard-${NAME}"
          echo "==> $IMG:$VERSION (+ :beta)  amd64+arm64"
          # QEMU（跨架构）：从 DockerHub 拉 binfmt 镜像，不用 docker/setup-qemu-action（该 runner 下不动 docker/* action）
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          # docker-container 驱动的 buildx builder（支持多架构 + --push 推 manifest list）
          docker buildx create --name multi --driver docker-container --use
          docker buildx inspect --bootstrap
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
          docker buildx build \
            -f "$DOCKERFILE" \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --provenance=false \
            -t "$IMG:$VERSION" -t "$IMG:beta" \
            --push .
