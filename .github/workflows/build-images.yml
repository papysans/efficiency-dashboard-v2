name: build-and-push-images

# 触发：打 v* tag 自动构建推 ghcr；也可在 Actions 页手动跑（指定版本）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.1.1，最终镜像 tag 为 beta-v1.1.1）"
        required: true
        default: "v1.1.1"

env:
  REGISTRY: ghcr.io

# 只用 actions/checkout；docker login/build/push 全走 runner 自带 docker CLI，
# 不依赖 docker/* marketplace action（该 runner 下载 docker/* action 持续失败）。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN 推 ghcr 所需，无需额外 PAT
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: backend/Dockerfile
          - name: kbcli
            dockerfile: kbcli/Dockerfile
          - name: portal
            dockerfile: compose/portal/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: 构建并推送 ${{ matrix.name }}（linux/amd64）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          NAME: ${{ matrix.name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$GITHUB_REF_NAME"; fi
          VERSION="beta-${RAW}"                       # beta 前缀
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"   # ghcr 要求小写
          IMG="${REGISTRY}/${OWNER_LC}/efficiency-dashboard-${NAME}"
          echo "==> $IMG:$VERSION (+ :beta)"
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
          DOCKER_BUILDKIT=1 docker build \
            -f "$DOCKERFILE" \
            --build-arg VERSION="$VERSION" \
            -t "$IMG:$VERSION" -t "$IMG:beta" .
          docker push "$IMG:$VERSION"
          docker push "$IMG:beta"
