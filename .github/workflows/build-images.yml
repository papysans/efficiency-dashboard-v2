name: build-and-push-images

# 触发：打 v* tag 自动构建推 ghcr；也可在 Actions 页手动跑（指定版本）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.1.1，最终 tag 为 beta-v1.1.1）"
        required: true
        default: "v1.1.1"

env:
  REGISTRY: ghcr.io

# 推送 linux/amd64 + linux/arm64 多平台 manifest，客户只需要拉取同一个 tag。
# 只用 actions/checkout；docker 全走 runner 自带 CLI，不依赖 docker/* marketplace action。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: server, dockerfile: backend/Dockerfile }
          - { name: kbcli,  dockerfile: kbcli/Dockerfile }
          - { name: portal, dockerfile: compose/portal/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: 构建并推送 ${{ matrix.image.name }} 多平台镜像
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          NAME: ${{ matrix.image.name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="$GITHUB_REF_NAME"; fi
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # 镜像嵌套到仓库路径下（efficiency-dashboard/<组件>），避开老 publish.yaml 占用的
          # 扁平名 efficiency-dashboard-kbcli/-backend；配合下方 source 标签链接到本仓库 packages。
          IMG="${REGISTRY}/${OWNER_LC}/efficiency-dashboard/${NAME}"
          TAG="beta-${RAW}"
          echo "==> $IMG:$TAG  (linux/amd64,linux/arm64)"
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --name b --driver docker-container --use
          docker buildx inspect --bootstrap
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
          docker buildx build \
            -f "$DOCKERFILE" \
            --platform "linux/amd64,linux/arm64" \
            --build-arg VERSION="beta-${RAW}" \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMG:$TAG" \
            --push .
