host: localhost:9990
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 效率仪表盘后端API，提供任务、提交、用户、仓库、项目、组织等数据管理接口
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Efficiency Dashboard API
  version: "1.0"
paths:
  /aggregate:
    get:
      description: 按维度（work_dir/repo/user/org1-4）聚合查询ES任务数据，返回各维度的统计指标
      parameters:
      - description: 开始日期(YYYYMMDD)
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期(YYYYMMDD)
        in: query
        name: endDate
        required: true
        type: string
      - description: 聚合维度(work_dir/repo/user/org1/org2/org3/org4)
        in: query
        name: dimension
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.AggregateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 维度聚合查询
      tags:
      - Aggregate
  /aggregate/keys:
    get:
      description: 按维度返回key列表，用于下拉提示，可选关键词过滤
      parameters:
      - description: 开始日期(YYYYMMDD)
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期(YYYYMMDD)
        in: query
        name: endDate
        required: true
        type: string
      - description: 聚合维度(work_dir/repo/user/org1/org2/org3/org4)
        in: query
        name: dimension
        required: true
        type: string
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.AggregateKeysResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 获取维度key列表
      tags:
      - Aggregate
  /analysis/code-attribution:
    get:
      description: 查询指定仓库和日期范围内的代码归属分析，统计AI和人工代码行数
      parameters:
      - description: 仓库ID
        in: query
        name: repo_id
        required: true
        type: string
      - description: 开始日期(YYYYMMDD)
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期(YYYYMMDD)
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CodeAttributionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 获取代码归属分析
      tags:
      - Attribution
  /analysis/code-source:
    get:
      description: 查询指定仓库的代码来源分布统计（AI当前/Human/AI其他/未知）
      parameters:
      - description: 仓库ID
        in: query
        name: repo_id
        required: true
        type: string
      - description: 开始日期(YYYYMMDD)
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期(YYYYMMDD)
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CodeSourceStatsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 获取代码来源统计
      tags:
      - Attribution
  /analysis/efficiency:
    get:
      description: 根据维度和ID查询提效分析结果，优先从PG缓存获取，无缓存时从ES实时计算
      parameters:
      - description: 维度(work_dir或repo)
        in: query
        name: dimension
        required: true
        type: string
      - description: 维度ID
        in: query
        name: id
        required: true
        type: string
      - description: 开始日期(YYYYMMDD)
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期(YYYYMMDD)
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.EfficiencyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 获取提效分析结果
      tags:
      - Efficiency
  /analysis/efficiency/correct:
    put:
      consumes:
      - application/json
      description: 纠正AI估算天数等字段，记录纠正历史，并重新计算提效比例
      parameters:
      - description: 纠正请求
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/main.CorrectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.EfficiencyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 纠正提效分析数据
      tags:
      - Efficiency
  /analysis/efficiency/history:
    get:
      description: 查询指定维度和ID的纠正历史记录
      parameters:
      - description: 维度(work_dir或repo)
        in: query
        name: dimension
        required: true
        type: string
      - description: 维度ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.EfficiencyHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
