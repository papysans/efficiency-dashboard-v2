server:
  port: 9990

stat_database:
  host: "192.168.137.106"
  port: 5432
  user: "postgres"
  password: "123456"
  dbname: "costrict_stat"
  sslmode: "disable"

task_dir: "s3://user-indicator/raw-dump/task"
repo_dir: "s3://user-indicator/raw-dump/repo"
analysed_dir: "../analysed"

storage:
  s3:
    endpoint: ""
    access_key: ""
    secret_key: ""
    use_ssl: true
    skip_bucket_check: true
    skip_verify: true

cors:
  allow_origins:
    - "*"

dashboard_title_prefix: "Costrict"

# commit 古法每行分钟数（派生 ancient 用），与 kbcli 写侧同值；本地存量数据隐含 2.0
commit_minutes_per_line: 2.0

# 人天单价（¥/人天），高管大屏把节省人天折算成节省成本用；缺省默认 2000。
# cost_per_person_day: 2000

ai_estimation:
  enabled: true
  api_key: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  base_url: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeout_ms: 300000
  http_proxy: ""

algo_estimation:
  max_input_chars: 300000    # 最大输入字符数
  max_ratio: 50              # 工作量的最大倍数
  max_factor: 1.0            # 最大的加权系数
  min_factor: 0.2            # 最小的加权系数
  inchars_per_minutes: 20    # 人每分钟输入20个字
  lines_per_minutes: 2       # 人每分钟输入2行代码
  min_minutes: 5             # 最小分钟数

task_real_minutes:
  gap_threshold_minutes: 30
  extension_minutes: 5

org_mapping_refresh:
  interval_minutes: 5
dept_sync:
  base_url: "http://192.168.137.106:8989"
  query_key: ""
  # root_dept_name: "深信服科技股份有限公司"
  root_dept_id: "49"

# chat-indicator-statistics 平台客观指标服务（/api/v2/chat/* 反代用）：
# base_url 填服务地址（不含路由前缀），空 = 功能关闭（接口返回 503，前端「平台」分组隐藏）。
# 内网 compose 示例：http://chat-indicator-statistics:8080；本地调试：http://127.0.0.1:8080
# 上游有 HTTP Basic Auth 时再填 username/password（两者均非空才注入 Authorization）。
# 外网实例示例：base_url: "https://zgsm.sangfor.com" + costrict 账号。
chat_stats:
  base_url: "http://192.168.137.106:8080"
  username: ""
  password: ""
