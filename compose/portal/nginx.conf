worker_processes 1;
error_log stderr notice;
events {
    worker_connections 1024;
}

http {
    variables_hash_max_size 1024;
    access_log off;
    real_ip_header X-Real-IP;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        root /var/www;
        index index.html;

        location /api/ {
            proxy_pass http://server:9990;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # location /costrict-admin/ {
        #     root /var/www;
        #     try_files $uri $uri/ /costrict-admin/index.html;
            
        #     # Handle SPA routes - return index.html for all non-file requests
        #     location ~ ^/costrict-admin/(?!assets|api).*$ {
        #         if (!-f $request_filename) {
        #             rewrite ^(.*)$ /costrict-admin/index.html break;
        #         }
        #     }
        # }

        location /static/ {
            alias static/;
        }

        location /login/ {
            alias login/;
        }
        # Configure access to CSS, JS, PNG, SVG files
        location ~* \.(css|js|png|svg)$ {
            expires 1d;  # Set cache expiration time
            add_header Access-Control-Allow-Origin *;  # Allow access from all domains
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';  # Allowed request methods
            add_header Access-Control-Allow-Headers 'Content-Type';  # Allowed request headers
        }

        # Configuration for other file types (optional)
        location ~* \.(jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
            expires 1d;  # Set cache expiration time
            add_header Access-Control-Allow-Origin *;  # Allow access from all domains
        }
    }
}
