services:
  portal:
    image: ${IMAGE_NGINX}
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    # 前端 dist 与 nginx.conf 已由 compose/portal/Dockerfile 打进镜像，无需卷挂载
    # （挂载会覆盖镜像内文件）。如需临时改 nginx 配置可临时挂 ./nginx.conf:/etc/nginx/nginx.conf:ro。
    ports:
      - "${PORT_PORTAL}:80"
    networks:
      - efficiency