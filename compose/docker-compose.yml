# 项目名隔离：容器/网络/卷都带 efficiency-dashboard-v2 前缀，与机器上的旧服务共存、不撞名。
# 也可用环境变量 COMPOSE_PROJECT_NAME 覆盖。
name: efficiency-dashboard-v2

# 容器 stdout/stderr 日志轮转：单容器封顶 max-size×max-file（10m×3=30MB），自动滚动覆盖，
# 避免 import 等长跑命令的日志在宿主无限堆积撑爆磁盘。所有服务共用此策略。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    extends:
      file: ./server/server.yml
      service: server
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  kbcli:
    extends:
      file: ./kbcli/kbcli.yml
      service: kbcli
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    extends:
      file: ./portal/portal.yml
      service: portal
    logging: *default-logging
    depends_on:
      server:
        condition: service_started

  postgres:
    extends:
      file: ./postgres/postgres.yml
      service: postgres
    logging: *default-logging

  # 可选：平台客观指标服务（LLM 请求 token/成本/时延），server 的 /api/v2/chat/* 反代它。
  # 默认不启动（profile 开关）；启用：docker compose --profile chat-stats up -d
  # 并打开 server/config.yaml 的 chat_stats.base_url（见 README「可选服务：chat-stats」）。
  chat-stats:
    extends:
      file: ./chat-stats/chat-stats.yml
      service: chat-stats
    profiles: ["chat-stats"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

networks:
  efficiency:
    driver: bridge
