# 项目名隔离：容器/网络/卷都带 efficiency-dashboard-v2 前缀，与机器上的旧服务共存、不撞名。
# 也可用环境变量 COMPOSE_PROJECT_NAME 覆盖。
name: efficiency-dashboard-v2

services:
  server:
    extends:
      file: ./server/server.yml
      service: server
    depends_on:
      postgres:
        condition: service_healthy
  
  kbcli:
    extends:
      file: ./kbcli/kbcli.yml
      service: kbcli
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    extends:
      file: ./portal/portal.yml
      service: portal
    depends_on:
      server:
        condition: service_started

  postgres:
    extends:
      file: ./postgres/postgres.yml
      service: postgres

networks:
  efficiency:
    driver: bridge
