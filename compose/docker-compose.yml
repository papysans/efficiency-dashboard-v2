version: '3.8'

services:
  server:
    extends:
      file: ./server/server.yml
      service: server
    depends_on:
      postgres:
        condition: service_healthy
  
  kbcli:
    extends:
      file: ./kbcli/kbcli.yml
      service: kbcli

  portal:
    extends:
      file: ./portal/portal.yml
      service: portal
    depends_on:
      server:
        condition: service_started

  postgres:
    extends:
      file: ./postgres/postgres.yml
      service: postgres

networks:
  efficiency:
    driver: bridge
