server:
  port: 9990

stat_database:
  host: "192.168.137.106"
  port: 5432
  user: "postgres"
  password: "123456"
  dbname: "costrict_stat"
  sslmode: "disable"

task_dir: "s3://user-indicator/raw-dump/task"
repo_dir: "s3://user-indicator/raw-dump/repo"
analysed_dir: "/app/analysed"
org_mapping: "/app/org_mapping.csv"

storage:
  s3:
    endpoint: "192.168.137.1:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    use_ssl: true
    skip_bucket_check: true
    skip_verify: true
    region: "us-east-1"

cors:
  allow_origins:
    - "*"

dashboard_title_prefix: "Costrict"

ai_estimation:
  enabled: true
  api_key: ""
  base_url: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeout_ms: 300000
  http_proxy: ""

task_real_minutes:
  gap_threshold_minutes: 30
  extension_minutes: 5

# dept-sync 部门同步服务（组织树代理 handler 用）：填上内网 dept-sync 地址与下发的 query_key 即生效
dept_sync:
  base_url: ""
  query_key: ""
  # 组织树根筛选（需求1）：/department/tree 返回含脏数据孤儿部门的森林。
  #   - 配 root_dept_id（优先）或 root_dept_name → 以该节点为唯一根，重建单根子树，过滤孤儿部门。
  #   - 两者都留空/注释掉 → 展示全部数据（多根森林，含孤儿部门），不再硬编码兜底某公司名。
  root_dept_name: "深信服科技股份有限公司"
  # root_dept_id: ""

# chat-indicator-statistics 平台客观指标服务（/api/v2/chat/* 反代用）。
# 默认注释 = 功能关闭（接口 503，前端「平台」分组隐藏）。
# 启用 compose 的 chat-stats 服务后打开（chat-stats 是栈内服务名，重启 server 生效）：
# chat_stats:
#   base_url: "http://chat-stats:8080"
#   # username/password 可选：仅上游带 HTTP Basic Auth 时填（如直连外网实例
#   # base_url: "https://zgsm.sangfor.com"，填 costrict 账号）；栈内 chat-stats 无鉴权，留空/不写即可。
#   # username: ""
#   # password: ""
