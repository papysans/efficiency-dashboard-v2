server:
  port: 9990

stat_database:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "1"
  dbname: "costrict_stat"
  sslmode: "disable"

task_dir: "/app/task"
repo_dir: "/app/repo"
analysed_dir: "/app/analysed"
org_mapping: "/app/org_mapping.csv"

cors:
  allow_origins:
    - "*"

dashboard_title_prefix: "Costrict"

ai_estimation:
  enabled: true
  api_key: "c0bebb770966452d9c415863d59c5161.alDVcnduh2Dgy3dN"
  base_url: "https://open.bigmodel.cn/api/anthropic"
  model: "claude-3-5-sonnet-20241022"
  timeout_ms: 300000
  http_proxy: ""

task_real_minutes:
  gap_threshold_minutes: 30
  extension_minutes: 5

# dept-sync 部门同步服务（组织树代理 handler 用）：填上内网 dept-sync 地址与下发的 query_key 即生效
dept_sync:
  base_url: ""
  query_key: ""
  # 组织树单根公司：/department/tree 返回的是含脏数据孤儿部门的森林，后端据此重建为单根子树。
  # 默认按名字匹配 "深信服科技股份有限公司"；若内网公司根 dept_id 已知，填 root_dept_id 更稳（优先级高于名字）。
  root_dept_name: "深信服科技股份有限公司"
  # root_dept_id: ""

# chat-indicator-statistics 平台客观指标服务（/api/v2/chat/* 反代用）。
# 默认注释 = 功能关闭（接口 503，前端「平台」分组隐藏）。
# 启用 compose 的 chat-stats 服务后打开（chat-stats 是栈内服务名，重启 server 生效）：
# chat_stats:
#   base_url: "http://chat-stats:8080"
#   # username/password 可选：仅上游带 HTTP Basic Auth 时填（如直连外网实例
#   # base_url: "https://zgsm.sangfor.com"，填 costrict 账号）；栈内 chat-stats 无鉴权，留空/不写即可。
#   # username: ""
#   # password: ""
