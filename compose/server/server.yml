services:
  server:
    image: ${IMAGE_SERVER}
    restart: always
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # 组织映射由 backend 从 user_org 表加载（kbcli import-org 写入），不读 CSV，故不挂载。
      - /mnt/prod_env/user-indicator/raw/task:/app/task
      - /mnt/prod_env/user-indicator/raw/repo:/app/repo
    ports:
      - "${PORT_BACKEND}:9990"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9990/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      TZ: Asia/Shanghai
    networks:
      - efficiency