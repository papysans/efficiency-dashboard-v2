traditional_dev_lines_per_day: 100

serve:
  port: 8080
  init:
    command: import
    params:
      force: true
  crontab:
    # 每 12 小时跑一次 import（mode=new 时含 efficiency-v2）。
    # days=2：【取数】只扫最近2天的 mnt 文件（不全量重拉历史）；
    # efficiency-v2 仍全量重算（days 不传给它），保证跨天 need 的 commit 不被窗内数据覆盖丢失。
    - schedule: "0 0 */12 * * *"
      command: import
      params:
        force: false
        days: 2
    - schedule: "0 0 1 * * *"
      command: fix-task
    - schedule: "0 0 3 * * *"
      command: fix-commit

# v2 调参区
efficiency_mode: new

efficiency_v2:
  baseline_defaults:
    # 三种古法基线的融合权重。LLM 关闭时，会在可用基线之间自动重归一。
    # 想让工作量提效更容易为正：提高 weight_algo，降低 weight_knn。
    weight_algo: 0.60
    weight_knn: 0.15
    weight_llm: 0.25
    # 工作量换算为日历周期的密度，只影响日历提效，不影响工作量提效。
    team_work_density: 0.35
  # 日历提效比标定：仅缩放基线日历(=融合工作量/密度)，1.0=不动。保留作为可选旋钮(本期未启用)。
  baseline_calendar_calibration: 1.0
  # 古法基线主系数(0=用内置默认 5/30)：调小→算法基线↓→日历提效比↓。本模板 weight_algo=0.60，算法占比高，效果明显。
  baseline_algo:
    think_turn_min: 2          # 古法每对话轮思考分钟，默认 5
    exec_file_coord_min: 10    # 古法每文件协调分钟，默认 30
  # 提效"异常"判定阈值(日历提效比口径)；超出才标 outlier/异常 tag。
  confidence_thresholds:
    outlier_efficiency_ratio_max: 2.0    # 原硬编码 0.9 → 2.0(>200% 才算异常)
    outlier_efficiency_ratio_min: -0.8   # 原硬编码 -0.5 → -0.8
  stage:
    # 原始工具调用没有结束时间时，用这些默认耗时补齐。
    default_edit_duration_seconds: 30
    default_read_duration_seconds: 10
    default_command_duration_seconds: 30
    default_other_duration_seconds: 10
    # 消息事件按字符数估时：300 表示每分钟 300 字。
    default_message_chars_per_minute: 300
    gap_threshold_minutes: 5
    extension_minutes: 2
    max_inferred_duration_gap_minutes: 5

# 算法估时配置
algo_estimation:
  # 古法每写 1 行代码需要多少分钟。数值越大，古法基线越高，工作量提效越容易为正。
  # 如果同时配置 commit_line_per_minutes，优先使用本字段。
  commit_minutes_per_line: 2.0
  max_input_chars: 300000    # 最大输入字符数
  max_ratio: 10              # 工作量的最大倍数
  max_factor: 1.0            # 最大的加权系数
  min_factor: 0.2            # 最小的加权系数
  inchars_per_minutes: 20    # 人每分钟输入20个字
  lines_per_minutes: 2       # 人每分钟输入2行代码
  min_minutes: 5             # 最小分钟数
  # 兼容旧字段：古法每分钟写多少行。新调参优先改 commit_minutes_per_line。
  # commit_line_per_minutes: 0.5

