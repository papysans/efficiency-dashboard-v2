http_proxy: "http://127.0.0.1:7890"

traditional_dev_lines_per_day: 100

serve:
  port: 8080
  init:
    command: import
    params:
      force: true
  crontab:
    # 每 12 小时跑一次 import（mode=new 时含 efficiency-v2）。
    # days=2：【取数】只扫最近2天的 mnt 文件（不全量重拉历史）；
    # efficiency-v2 仍全量重算（days 不传给它），保证跨天 need 的 commit 不被窗内数据覆盖丢失。
    - schedule: "0 0 */12 * * *"
      command: import
      params:
        force: false
        days: 2
    - schedule: "0 0 1 * * *"
      command: fix-task
    - schedule: "0 0 3 * * *"
      command: fix-commit

# v2 调参区
efficiency_mode: new

efficiency_v2:
  baseline_defaults:
    # 三种古法基线的融合权重。LLM 关闭时，会在可用基线之间自动重归一。
    # 想让工作量提效更容易为正：提高 weight_algo，降低 weight_knn。
    weight_algo: 0.60
    weight_knn: 0.15
    weight_llm: 0.25
    # 工作量换算为日历周期的密度，只影响日历提效，不影响工作量提效。
    team_work_density: 0.35
  # 日历提效比标定：仅缩放基线日历(=融合工作量/密度)，1.0=不动。保留作为可选旋钮(本期未启用)。
  baseline_calendar_calibration: 1.0
  # 古法基线主系数：恢复内置默认 5/30（撤回此前的 2/10 压低）。
  baseline_algo:
    think_turn_min: 5          # 古法每对话轮思考分钟，内置默认 5
    exec_file_coord_min: 30    # 古法每文件协调分钟，内置默认 30
  # 提效"异常"判定阈值(日历提效比口径)；超出才标 outlier/异常 tag。
  confidence_thresholds:
    outlier_efficiency_ratio_max: 10.0   # >1000% 才算异常上限(此前 2.0=>200%；放宽以保留高提效真值)
    outlier_efficiency_ratio_min: -2.0   # 下限 -200%(此前 -0.8)；提效比数学下界为 -1.0，故等于关闭下限侧 outlier(负提效全部计入)
    # LOC 速率物理不可能阈值：total_loc_net/total_calendar_min > 此值 → 打 outlier(仅从聚合统计剔除，不封顶、单任务页仍显真实值)。
    # 7 ≈ 一个日历日(24h)写 1w 行；设为负数可关闭。
    outlier_loc_per_calendar_min_max: 7
  # 极端值排除范围：哪些异常类别真正"隐藏+不计入聚合"(置 outlier_flag)。可选: efficiency_ratio, loc_rate, actual_to_baseline。
  # 撞线但不在 scope 内的类别：reason 文本仍记录(诊断/前端 tag)，但 outlier_flag=false → 照常计入。
  # 留空 scope: [] = none(全部计入，含极端值)。整段不写 = 默认三类全排(保持历史行为)。改这里要重算 efficiency-v2 才生效。
  exclusion:
    scope: [efficiency_ratio, loc_rate, actual_to_baseline]
  # kNN 锚点母表 CSV 路径，供 `kbcli import-anchor` 灌入 anchor_set。可被 --csv 覆盖。
  # 注意：CSV 默认不在镜像里——prod 需把 CSV 挂到此路径，或在 kbcli 镜像 COPY docs/data。
  anchor_set_csv: /app/docs/data/efficiency_v2_anchor_set.csv
  stage:
    # 原始工具调用没有结束时间时，用这些默认耗时补齐。
    default_edit_duration_seconds: 30
    default_read_duration_seconds: 10
    default_command_duration_seconds: 30
    default_other_duration_seconds: 10
    # 消息事件按字符数估时：300 表示每分钟 300 字。
    default_message_chars_per_minute: 300
    gap_threshold_minutes: 5
    extension_minutes: 2
    max_inferred_duration_gap_minutes: 5

# 算法估时配置
algo_estimation:
  # 古法每写 1 行代码需要多少分钟。数值越大，古法基线越高，工作量提效越容易为正。
  # 如果同时配置 commit_line_per_minutes，优先使用本字段。
  commit_minutes_per_line: 1.8  # 每行代码古法时间，2.0→1.8 轻微压低基线
  max_input_chars: 300000    # 最大输入字符数
  max_ratio: 10              # 工作量的最大倍数
  max_factor: 1.0            # 最大的加权系数
  min_factor: 0.2            # 最小的加权系数
  inchars_per_minutes: 20    # 人每分钟输入20个字
  lines_per_minutes: 2       # 人每分钟输入2行代码
  min_minutes: 5             # 最小分钟数
  # 兼容旧字段：古法每分钟写多少行。新调参优先改 commit_minutes_per_line。
  # commit_line_per_minutes: 0.5

